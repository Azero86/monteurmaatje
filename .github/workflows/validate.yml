name: MonteurMaatje validatie

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Data en app-integriteit
        run: node scripts/validate.mjs

  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installeer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start lokale MonteurMaatje
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/monteurmaatje-http.log 2>&1 &
          echo $! > /tmp/monteurmaatje-http.pid
          sleep 2
      - name: Navigatie, terugknop, viewer en offline tests
        run: npx playwright test tests/navigation.spec.mjs --project=chromium --workers=1
