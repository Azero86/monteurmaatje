<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina niet gevonden – MonteurMaatje</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f5;color:#142b26}
    main{max-width:38rem;padding:2rem;text-align:center}a{color:inherit;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Pagina niet gevonden</h1>
    <p>Ga terug naar MonteurMaatje.</p>
    <p><a id="home" href="./">Naar de startpagina</a></p>
  </main>
  <script>
    // On a GitHub project page, keep the repository base path instead of jumping to github.io root.
    const parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('.github.io') && parts.length) {
      document.getElementById('home').href = '/' + parts[0] + '/';
    } else {
      document.getElementById('home').href = '/';
    }
  </script>
</body>
</html>
